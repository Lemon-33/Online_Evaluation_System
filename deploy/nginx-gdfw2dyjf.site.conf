# gdfw2dyjf.site —— 80 端口反向代理到本机 3000
#
# 为什么整站反代、不单独配 root/try_files：
#   server.js 自己托管前端静态资源（DIST = server.js 同级的 dist/），
#   并且带了 SPA 路由兜底（非 /api 一律回 index.html）。
#   所以 nginx 只要把 / 全部转给 3000，前端和 /api 就都通了。
#
# 用法：
#   sudo cp nginx-gdfw2dyjf.site.conf /etc/nginx/conf.d/pingjia.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 上 HTTPS 时不要手改本文件，直接跑 certbot（它会自动改这个文件）：
#   sudo certbot --nginx -d gdfw2dyjf.site -d www.gdfw2dyjf.site
#
# 与同服务器上其他网站共存：
#   多个网站可以共用 80 端口 —— nginx 按请求头 Host 匹配各自的 server_name。
#   本块只认 gdfw2dyjf.site / www.gdfw2dyjf.site，别的域名走它们自己的 server 块。
#   ⚠️ 不要加 default_server，否则会抢走其他站点的兜底流量（纯 IP 访问会落到本站）。
#   若 80 已被 Apache 等占用，nginx 会 bind 失败：需先让对方改端口（如 8080）再反代过去。

server {
    listen 80;
    listen [::]:80;
    server_name gdfw2dyjf.site www.gdfw2dyjf.site;

    # 导出 / 上传若走接口则需要；本项目导出在前端做，留着只是保险
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # 后端要拿到真实域名 / 协议 / 客户端 IP
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
